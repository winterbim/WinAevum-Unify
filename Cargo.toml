[workspace]
members = [
  "crates/sentinel-kernel",
  "crates/capability-engine",
  "crates/identity",
  "crates/secret-broker",
  "crates/ledger",
  "crates/attestation",
  "crates/evidence-graph",
  "crates/autonomy-governor",
  "crates/unify-cli",
  "crates/git-provider",
  "crates/memory-fabric",
  "crates/aevum-mcp",
  "crates/agent-trust-bench",
  "crates/memory-truth-bench",
]
resolver = "2"

[workspace.package]
version = "0.1.0-m0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/winterbim/WinAevum-Unify"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ulid = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["serde"] }
hex = "0.4"